<section class="section">
  <div class="container">
    <div class="contact-grid">

      <div class="contact-form-col">
        <h2 class="section-title">Send us a message</h2>
        <p class="section-intro">We read everything that comes in and reply when a reply is warranted.</p>

        <!-- ===================================================================
             FORM DELIVERY
             A site hosted on GitHub Pages is static, so it cannot send email
             on its own. This form posts to Formspree, which forwards each
             submission to contact@kerad.org.

             To switch it on:
               1. Create a free account at formspree.io
               2. Make a new form, set the destination to contact@kerad.org
               3. Replace YOUR_FORM_ID below with the ID Formspree gives you

             Until then the form will not deliver anything.
             =================================================================== -->
        <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">

          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary">Send message</button>

        </form>
      </div>

      <div class="contact-info-col">
        <div class="info-box">
          <h3>Email</h3>
          <p>Write to us directly:</p>
          <p class="email"><a href="mailto:contact@kerad.org">contact@kerad.org</a></p>
        </div>
      </div>

    </div>
  </div>
</section>
